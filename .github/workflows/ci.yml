name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate public repository boundary
        shell: pwsh
        run: ./tools/Test-PublicRepository.ps1 -Version 3.81

      - name: Validate Windows PowerShell encoding
        shell: pwsh
        run: ./tests/Check-Encoding.ps1

      - name: Install pinned Pester
        shell: powershell
        run: Install-Module Pester -RequiredVersion 4.10.1 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run portable test suite
        shell: powershell
        run: ./tests/Run-Tests.ps1 -TimeoutSeconds 180

      - name: Build and verify development installer
        shell: powershell
        run: |
          ./installer/Build-Release.ps1 -DevelopmentUnsigned -Version 3.81
          ./installer/Build-Release.ps1 -VerifyOnly -Version 3.81 -InstallerPath ./artifacts/development-unsigned/LanFileSharing-Setup-v3.81-UNSIGNED-DEVELOPMENT.exe

